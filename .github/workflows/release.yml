# Cuts a GitHub Release when a version tag is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# Builds the five cross-platform binaries (make release), generates SHA-256
# checksums, and attaches them all to the release. Release notes are generated
# from the commits/PRs since the previous tag.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the release and upload assets

jobs:
  release:
    name: build + publish binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags so `git describe` sets VERSION

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # no go.sum: zero third-party dependencies, nothing to cache

      - name: Build cross-platform binaries
        run: make release

      - name: Generate checksums
        run: cd dist && sha256sum azsql-migration-test-* > checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
